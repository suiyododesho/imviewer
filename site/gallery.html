<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery - View</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root {
      --gallery-fullscreen-vh: 100vh;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .header {
      flex-shrink: 0;
    }

    .breadcrumbs {
      flex-shrink: 0;
    }

    .gallery-frame-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      align-items: stretch;
      justify-content: stretch;
    }

    .photo-viewer {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
      background: #111;
      padding: 8px;
      overflow: hidden;
      gap: 10px;
    }

    body.gallery-pseudo-fullscreen-active {
      overflow: hidden;
    }

    #photoViewer.is-pseudo-fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: var(--gallery-fullscreen-vh);
      max-height: var(--gallery-fullscreen-vh);
      z-index: 5000;
      background: #000;
      padding: 8px;
      margin: 0;
    }

    .pseudo-fullscreen-exit {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 35;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.42);
      background: rgba(18, 18, 18, 0.78);
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      backdrop-filter: blur(2px);
    }

    .pseudo-fullscreen-exit:hover {
      background: rgba(30, 30, 30, 0.9);
    }

    .pseudo-fullscreen-exit:focus-visible {
      outline: 2px solid #8ac8ff;
      outline-offset: 2px;
    }

    #photoViewer.is-pseudo-fullscreen .pseudo-fullscreen-exit {
      display: inline-flex;
    }

    .thumb-strip {
      width: 96px;
      min-width: 96px;
      max-width: 96px;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      background: #1a1a1a;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }

    .thumb-item {
      width: 100%;
      height: 64px;
      border: 2px solid transparent;
      border-radius: 4px;
      overflow: hidden;
      cursor: pointer;
      background: #202020;
      padding: 0;
      flex-shrink: 0;
      position: relative;
    }

    .thumb-item:focus-visible {
      outline: 2px solid #5aa8ff;
      outline-offset: 1px;
    }

    .thumb-item.is-active {
      border-color: #5aa8ff;
      box-shadow: 0 0 0 1px rgba(90, 168, 255, 0.4);
    }

    .thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-item.is-video {
      background: linear-gradient(180deg, #27354a 0%, #19202b 100%);
      color: #fff;
    }

    .video-thumb {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      gap: 2px;
      position: relative;
      padding: 6px 4px;
      text-align: center;
    }

    .video-thumb-icon {
      font-size: 20px;
      line-height: 1;
    }

    .video-thumb-label {
      font-size: 10px;
      letter-spacing: 0.08em;
      opacity: 0.92;
    }

    .video-thumb-ext {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .video-thumb-number {
      position: absolute;
      top: 4px;
      right: 4px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.78);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }

    .photo-stage {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      background: #0f0f0f;
      padding: 10px;
      position: relative;
    }

    .photo-stage.is-thumbnail-mode .media-stage-root {
      display: none;
    }

    .photo-stage.is-zoomable {
      cursor: grab;
    }

    .photo-stage.is-dragging {
      cursor: grabbing;
    }

    .photo-stage img,
    .photo-stage video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .media-stage-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 0;
      min-height: 0;
    }

    .media-stage-content.is-spread {
      flex-direction: row;
      align-items: stretch;
      justify-content: center;
      gap: 0;
      transform-origin: center center;
      transition: transform 120ms ease-out;
      will-change: transform;
    }

    .media-stage-content.is-spread.is-dragging {
      transition: none;
    }

    .media-stage-pane {
      flex: 1;
      min-width: 0;
      min-height: 0;
      border: none;
      border-radius: 0;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0;
    }

    .media-stage-pane.is-spread-left {
      justify-content: flex-end;
    }

    .media-stage-pane.is-spread-right {
      justify-content: flex-start;
    }

    .media-stage-pane.is-empty {
      background: transparent;
    }

    .media-stage-pane img,
    .media-stage-pane video {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .media-stage-image {
      transform-origin: center center;
      transition: transform 120ms ease-out;
      will-change: transform;
      user-select: none;
      -webkit-user-drag: none;
    }

    .media-stage-image.is-dragging {
      transition: none;
    }

    .zoom-control {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      width: 40px;
      padding: 10px 6px;
      border-radius: 10px;
      background: rgba(13, 13, 13, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.14);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      backdrop-filter: blur(2px);
    }

    .photo-stage.is-thumbnail-mode .zoom-control {
      display: none;
    }

    .thumb-mode-toggle {
      position: absolute;
      left: 10px;
      bottom: 10px;
      z-index: 20;
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(20, 20, 20, 0.82);
      color: #f2f2f2;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.16s ease, transform 0.16s ease;
    }

    .thumb-mode-toggle:hover {
      background: rgba(36, 36, 36, 0.92);
    }

    .thumb-mode-toggle:active {
      transform: translateY(1px);
    }

    .thumb-mode-toggle:focus-visible {
      outline: 2px solid #80beff;
      outline-offset: 2px;
    }

    .thumb-mode-toggle-icon {
      width: 21px;
      height: 21px;
      display: block;
      fill: currentColor;
    }

    .thumb-mode-toggle .icon-picture {
      display: none;
    }

    .thumb-mode-toggle.is-thumbnail-mode .icon-grid {
      display: none;
    }

    .thumb-mode-toggle.is-thumbnail-mode .icon-picture {
      display: block;
    }

    .stage-thumbnail-panel {
      --stage-thumb-min: 76px;
      --stage-thumb-gap: 10px;
      position: absolute;
      inset: 10px;
      z-index: 9;
      display: block;
      border-radius: 6px;
      border: 1px solid #2c2c2c;
      background: rgba(14, 14, 14, 0.96);
      padding: 10px 10px 56px;
      overflow-y: auto;
      overflow-x: hidden;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .stage-thumbnail-virtual-content {
      position: relative;
      min-height: 100%;
    }

    .photo-stage.is-thumbnail-mode .stage-thumbnail-panel {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
    }

    .stage-thumb-item {
      width: 76px;
      height: 76px;
      border: 2px solid transparent;
      border-radius: 6px;
      overflow: hidden;
      background: #1f1f1f;
      cursor: pointer;
      padding: 0;
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      content-visibility: auto;
      contain-intrinsic-size: 76px 76px;
      contain: layout paint;
    }

    .stage-thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .stage-thumb-loading {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #dbe8f5;
      font-size: 10px;
      line-height: 1.3;
      text-align: center;
      padding: 6px;
    }

    .stage-thumb-spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(167, 197, 227, 0.28);
      border-top-color: #80c3ff;
      animation: stage-thumb-spin 0.9s linear infinite;
    }

    .stage-thumb-loading-label {
      letter-spacing: 0.02em;
      color: #c9d9ea;
    }

    @keyframes stage-thumb-spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .stage-thumb-item:focus-visible {
      outline: 2px solid #73b5ff;
      outline-offset: 1px;
    }

    .stage-thumb-item.is-active {
      border-width: 4px;
      border-color: #7fc0ff;
      box-shadow: 0 0 0 1px rgba(127, 192, 255, 0.35);
    }

    .stage-thumb-item.is-video {
      color: #fff;
      background: linear-gradient(180deg, #263547 0%, #17212e 100%);
      font-size: 12px;
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    .stage-thumb-item.is-video::before {
      content: 'VIDEO';
    }

    .stage-mode-busy {
      position: absolute;
      inset: 0;
      z-index: 18;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      background: rgba(8, 8, 8, 0.42);
      backdrop-filter: blur(1px);
    }

    .stage-mode-busy[hidden] {
      display: none;
    }

    .stage-mode-busy-inner {
      min-width: 128px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(180, 210, 236, 0.28);
      background: rgba(14, 18, 23, 0.88);
      color: #e4eef8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .stage-mode-busy-spinner {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid rgba(126, 180, 231, 0.24);
      border-top-color: #7ec6ff;
      animation: stage-thumb-spin 0.8s linear infinite;
    }

    .stage-mode-busy-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    .zoom-control[aria-disabled="true"] {
      opacity: 0.45;
    }

    .zoom-slider {
      writing-mode: vertical-lr;
      direction: rtl;
      width: 22px;
      height: 180px;
      margin: 0;
      cursor: pointer;
    }

    .zoom-value {
      color: #e9eef7;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      min-height: 14px;
    }

    .media-stage-video {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      background: #000;
      border-radius: 4px;
    }

    .media-note {
      color: #d8dde5;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    .media-note.is-warning {
      color: #ffd484;
    }

    .media-note a {
      color: #8bc0ff;
    }

    .photo-error {
      color: #eee;
      font-size: 16px;
      text-align: center;
    }

    @media (max-width: 900px) {
      .photo-stage {
        touch-action: none;
      }

      .thumb-strip {
        width: 78px;
        min-width: 78px;
        max-width: 78px;
      }

      .thumb-item {
        height: 56px;
      }

      .zoom-control {
        width: 34px;
        padding: 8px 4px;
      }

      .zoom-slider {
        height: 150px;
      }

      .stage-thumbnail-panel {
        --stage-thumb-min: 68px;
        --stage-thumb-gap: 8px;
      }

      .thumb-mode-toggle {
        width: 38px;
        height: 38px;
      }
    }

    @media (max-width: 768px) {
      body {
        height: auto;
        width: auto;
        overflow: auto;
      }

      .gallery-frame-container {
        overflow: visible;
        min-height: 0;
      }

      .photo-viewer {
        flex-direction: column;
        padding: 6px;
        gap: 8px;
      }

      .thumb-strip {
        width: 100%;
        min-width: 0;
        max-width: none;
        height: 84px;
        overflow-x: auto;
        overflow-y: hidden;
        flex-direction: row;
        padding: 6px;
      }

      .thumb-item {
        width: 72px;
        min-width: 72px;
        height: 100%;
      }

      .photo-stage {
        min-height: min(58vh, 440px);
        padding: 8px;
      }

      .zoom-control {
        top: auto;
        right: 10px;
        bottom: 10px;
        width: auto;
        padding: 6px 8px;
        flex-direction: row;
        gap: 6px;
      }

      .zoom-slider {
        writing-mode: horizontal-tb;
        direction: ltr;
        width: 104px;
        height: 20px;
      }

      .gallery-footer-nav {
        padding: 12px 16px;
        gap: 12px;
      }

      .gallery-footer-main {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .gallery-footer-nav .nav-buttons {
        width: 100%;
        flex-wrap: wrap;
      }

      .spread-mode-control {
        width: 100%;
      }

      .spread-mode-button {
        width: 100%;
        min-width: 0;
      }

      .spread-mode-menu {
        left: 0;
        right: auto;
        width: 100%;
      }

      .gallery-footer-nav .nav-buttons .nav-button {
        flex: 1 1 calc(50% - 6px);
      }

      .gallery-page-nav {
        flex-wrap: wrap;
      }

      .external-link {
        white-space: normal;
        text-align: center;
      }

      .keyboard-help {
        font-size: 11px;
      }
    }

    @media (max-width: 480px) {
      .thumb-strip {
        height: 74px;
      }

      .thumb-item {
        width: 62px;
        min-width: 62px;
      }

      .photo-stage {
        min-height: 50vh;
      }

      .zoom-control {
        left: 50%;
        right: auto;
        transform: translateX(-50%);
      }

      .gallery-footer-nav .nav-buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .gallery-footer-nav .nav-buttons .nav-button {
        min-width: 0;
        width: 100%;
      }

      .gallery-footer-nav .nav-buttons #fullscreenToggle {
        grid-column: 1 / -1;
      }

      .pseudo-fullscreen-exit {
        width: 40px;
        height: 40px;
        font-size: 22px;
      }
    }

    .gallery-footer-nav {
      flex-shrink: 0;
      background-color: #f9f9f9;
      border-top: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gallery-footer-main {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .gallery-footer-nav .nav-buttons {
      display: flex;
      gap: 12px;
    }

    .spread-mode-control {
      position: relative;
      flex-shrink: 0;
    }

    .spread-mode-button {
      min-width: 190px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #d6dbe3;
      border-radius: 8px;
      background: #fff;
      color: #1f2a37;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .spread-mode-button::after {
      content: '▾';
      font-size: 12px;
      color: #4c5e75;
    }

    .spread-mode-button:hover {
      border-color: #aac5e4;
      background: #f5faff;
    }

    .spread-mode-button:focus-visible {
      outline: 2px solid #7fb7ef;
      outline-offset: 1px;
    }

    .spread-mode-menu {
      position: absolute;
      right: 0;
      bottom: calc(100% + 8px);
      width: min(260px, 72vw);
      border: 1px solid #d2dae5;
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(12, 30, 53, 0.18);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      z-index: 30;
    }

    .spread-mode-menu[hidden] {
      display: none;
    }

    .spread-mode-menu-item {
      width: 100%;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      color: #243447;
      text-align: left;
      padding: 8px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    .spread-mode-menu-item:hover {
      background: #eff6ff;
      border-color: #c7dcf7;
    }

    .spread-mode-menu-item.is-active {
      background: #0f4c81;
      color: #fff;
      border-color: #0f4c81;
      font-weight: 700;
    }

    .keyboard-help {
      width: 100%;
      font-size: 12px;
      color: #666;
      background: #f1f1f1;
      border: 1px solid #e2e2e2;
      border-radius: 4px;
      padding: 8px 10px;
      line-height: 1.4;
    }

    .keyboard-help kbd {
      display: inline-block;
      min-width: 20px;
      padding: 1px 6px;
      margin: 0 2px;
      border: 1px solid #c8c8c8;
      border-bottom-width: 2px;
      border-radius: 3px;
      background: #fff;
      color: #333;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      text-align: center;
      vertical-align: middle;
    }

    .external-link {
      color: #0066cc;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }

    .external-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .gallery-footer-main {
        flex-wrap: wrap;
      }

      .external-link {
        order: 3;
      }
    }

    .gallery-page-nav {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .gallery-page-nav:empty {
      display: none;
    }

    .page-nav-btn {
      padding: 4px 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      color: #0066cc;
      line-height: 1.4;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .page-nav-btn:hover:not(:disabled):not(.is-current) {
      background: #eef5ff;
      border-color: #aac8ff;
    }

    .page-nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      color: #999;
    }

    .page-nav-btn.is-current {
      background: #0f4c81;
      border-color: #0f4c81;
      color: #fff;
      font-weight: 700;
      cursor: default;
    }
  </style>
</head>
<body data-gallery-page="true">
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <a href="index.html" class="site-title">Photo Gallery</a>
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="人物名で検索"
          aria-label="Search people by name"
        >
      </div>
    </div>
  </header>

  <!-- Breadcrumbs -->
  <nav class="breadcrumbs">
    <div class="breadcrumbs-content">
      <a href="index.html">トップ</a>
      <span>&gt;</span>
      <a href="#" id="projectLink">企画</a>
      <span>&gt;</span>
      <a href="#" id="personLink">人物</a>
      <span>&gt;</span>
      <span id="galleryName" class="breadcrumb-current">ギャラリー</span>
    </div>
  </nav>

  <!-- Gallery Frame Container -->
  <div class="gallery-frame-container">
    <div id="photoViewer" class="photo-viewer">
      <button id="pseudoFullscreenExit" class="pseudo-fullscreen-exit" type="button" aria-label="擬似フルスクリーンを終了" hidden>×</button>
      <div id="thumbList" class="thumb-strip" aria-label="サムネイル一覧"></div>
      <div id="photoStage" class="photo-stage" aria-live="polite" aria-label="メディア表示エリア">
        <div id="zoomControl" class="zoom-control" aria-label="画像ズーム" aria-disabled="true">
          <input id="zoomSlider" class="zoom-slider" type="range" min="0" max="14" step="1" value="0" aria-label="画像の拡大縮小">
          <span id="zoomValue" class="zoom-value">100%</span>
        </div>
        <div id="stageThumbnailPanel" class="stage-thumbnail-panel" aria-label="ギャラリー全サムネイル" hidden></div>
        <div id="stageModeBusy" class="stage-mode-busy" hidden aria-hidden="true">
          <div class="stage-mode-busy-inner" role="status" aria-live="polite" aria-label="サムネイル準備中">
            <span class="stage-mode-busy-spinner" aria-hidden="true"></span>
            <span class="stage-mode-busy-label">処理中...</span>
          </div>
        </div>
        <button id="thumbModeToggle" class="thumb-mode-toggle" type="button" aria-label="全サムネイルを表示" aria-pressed="false">
          <svg class="thumb-mode-toggle-icon icon-grid" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="3" y="3" width="8" height="8" rx="1.2"></rect>
            <rect x="13" y="3" width="8" height="8" rx="1.2"></rect>
            <rect x="3" y="13" width="8" height="8" rx="1.2"></rect>
            <rect x="13" y="13" width="8" height="8" rx="1.2"></rect>
          </svg>
          <svg class="thumb-mode-toggle-icon icon-picture" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 2v12h16V6H4zm3 9 3-3 2.2 2.2 3.8-4.2L20 15H7zm1.5-7.25a1.75 1.75 0 1 0 0 3.5 1.75 1.75 0 0 0 0-3.5z"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Footer Navigation -->
    <div class="gallery-footer-nav">
      <div class="gallery-footer-main">
        <div class="nav-buttons">
          <button id="prevButton" class="nav-button">← 前へ</button>
          <button id="nextButton" class="nav-button">次へ →</button>
          <button id="fullscreenToggle" class="nav-button" aria-pressed="false">全画面</button>
        </div>
        <div class="spread-mode-control">
          <button id="spreadModeButton" class="spread-mode-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="spreadModeMenu">単一ページ表示</button>
          <div id="spreadModeMenu" class="spread-mode-menu" role="menu" hidden></div>
        </div>
        <a id="openOriginalLink" class="external-link" href="#" target="_blank" rel="noopener noreferrer">元のHTMLを別タブで開く</a>
        <div id="galleryPageNav" class="gallery-page-nav"></div>
        <span id="navInfo" class="nav-info"></span>
      </div>
      <div class="keyboard-help" aria-label="キーボード操作説明">
        キーボード操作:
        <kbd>←</kbd>/<kbd>→</kbd> 前後のメディア,
        <kbd>F</kbd> 全画面切替,
        <kbd>Esc</kbd> 全画面解除
        <br>
        マウス操作:
        ホイールまたは右上スライダーでズーム,
        拡大時のドラッグで表示領域を移動
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/structure.js"></script>
  <script src="js/gallery-pages.js"></script>
  <script src="js/site-config.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/search.js"></script>
  <script src="js/series.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
