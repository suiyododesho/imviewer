<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全人物一覧 - Photo Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <a href="index.html" class="site-title">Photo Gallery</a>
      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="人物名で検索"
          aria-label="Search people by name"
        >
      </div>
    </div>
  </header>

  <!-- Breadcrumbs -->
  <nav class="breadcrumbs">
    <div class="breadcrumbs-content">
      <a href="index.html">トップ</a>
      <span>›</span>
      <span class="breadcrumb-current">全人物一覧</span>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <div class="main-content">
      <div class="page-shell">
        <aside class="side-panel" aria-label="サイドメニュー">
          <div class="sidebar-card">
            <div id="seriesSidebar"></div>
          </div>
        </aside>

        <div class="page-main">
          <h1 class="persons-page-title">全人物一覧</h1>
          <div id="personsContainer">
            <!-- Populated by JavaScript -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="js/structure.js"></script>
  <script src="js/site-config.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/search.js"></script>
  <script src="js/series.js"></script>
  <script src="js/persons.js"></script>
</body>
</html>
